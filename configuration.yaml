homeassistant:
  customize: !include customize.yaml
  auth_mfa_modules:
    - type: totp
group: !include groups.yaml
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
sensor manual: !include_dir_merge_list sensors/
person: !include persons.yaml
notify: !include notify.yaml
input_boolean: !include inputs.yaml

default_config:

mobile_app:

my:

frontend:
  themes: !include themes.yaml

config:

lovelace:

api:

system_health:

auth:

conversation:

sun:

device_sun_light_trigger:
  light_group: light.couch_lights
  device_group: group.people

history:

recorder:
  exclude:
    entities:
      - sensor.dishbert_remaining_program_time
      - sensor.solix_c300x_dc_remaining_time
      - sensor.solix_c300x_dc_mqtt_time
    entity_globs:
      - sensor.litfassstrasse*
      - sensor.zippererstrasse*

logbook:

tts:
  - platform: google_translate
    service_name: google_say

google_assistant:
  project_id: grubfx-home-assistant
  service_account: !include SERVICE_ACCOUNT.json
  report_state: true

wake_on_lan:

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - !secret router_ip
    - !secret nas_ip
    - !secret npm_ip
    - 172.30.33.0/24
  cors_allowed_origins:
    - https://cast.home-assistant.io
websocket_api:

energy:

powercalc:

plant: !include plants.yaml
